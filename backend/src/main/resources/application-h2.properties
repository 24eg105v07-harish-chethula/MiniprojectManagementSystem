spring.application.name=mini-project-management
server.port=8080

# In-Memory H2 Database Fallback Configuration
spring.datasource.url=jdbc:h2:mem:mini_project_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# Default Admin Bootstrap Credentials
app.admin.fullname=System Administrator
app.admin.email=admin@project.com
app.admin.password=Admin@123

# Logging
logging.level.com.project.management=INFO
logging.level.org.springframework.security=WARN
